name: Neon Arena Web CI

on:
  push:
    paths:
      - "neon-arena-web/**"
      - ".github/workflows/neon-arena-web-ci.yml"
  pull_request:
    paths:
      - "neon-arena-web/**"
      - ".github/workflows/neon-arena-web-ci.yml"

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neon-arena-web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: neon-arena-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Type check
        run: npm run lint

      - name: Build
        run: npm run build
