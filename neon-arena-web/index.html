<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04131f" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Neon Arena Web</title>
  </head>
  <body>
    <div id="app">
      <section id="menu" class="panel">
        <div class="brand">
          <img src="/icon.svg" alt="" width="54" height="54" />
          <div>
            <h1>Neon Arena</h1>
            <p>Web/PWA 多人竞技场</p>
          </div>
        </div>

        <div class="grid">
          <label>
            昵称
            <input id="nickname" value="Player" maxlength="18" />
          </label>
          <label>
            地图
            <select id="map-select"></select>
          </label>
          <label>
            规则
            <select id="ruleset-select">
              <option value="standard">普通模式</option>
              <option value="meleeOnly">肉搏模式</option>
            </select>
          </label>
          <label>
            AI 难度
            <select id="difficulty-select">
              <option value="easy">简单</option>
              <option value="medium" selected>中等</option>
              <option value="hard">困难</option>
            </select>
          </label>
          <label>
            视觉主题
            <select id="theme-select"></select>
          </label>
          <label>
            房间人数
            <select id="target-players-select">
              <option value="2">2 人</option>
              <option value="3">3 人</option>
              <option value="4">4 人</option>
            </select>
          </label>
          <label>
            房间码
            <input id="room-code" placeholder="创建后生成，或输入加入" maxlength="8" />
          </label>
        </div>

        <div class="actions">
          <button id="single-button">单人 AI</button>
          <button id="create-room-button">创建在线房间</button>
          <button id="join-room-button">加入在线房间</button>
        </div>
        <p id="status">准备开始。</p>
      </section>

      <div id="game-shell" hidden>
        <div id="game-root"></div>
        <div id="hud">
          <span id="hud-mode"></span>
          <span id="hud-zone"></span>
          <select id="hud-theme-select" aria-label="视觉主题"></select>
          <button id="leave-button" type="button">退出</button>
        </div>
        <div id="touch-controls">
          <div id="move-stick" class="stick"><span></span></div>
          <div class="combat">
            <button data-action="fire">射击</button>
            <button data-action="punch">拳</button>
            <button data-action="flyingKick">踢</button>
            <button data-action="throw">摔</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
