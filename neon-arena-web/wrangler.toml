name = "neon-arena-room-worker"
main = "src/worker/index.ts"
compatibility_date = "2026-06-05"
compatibility_flags = ["nodejs_compat"]

[durable_objects]
bindings = [
  { name = "NEON_ROOM", class_name = "NeonRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NeonRoom"]

[assets]
directory = "./dist"
binding = "ASSETS"
