name = "neon-arena-room-worker"
main = "src/worker/index.ts"
compatibility_date = "2026-06-05"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "NeonArenaRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["NeonRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["NeonArenaRoom"]

[[routes]]
pattern = "ctrlclaw.online/*"
zone_name = "ctrlclaw.online"
